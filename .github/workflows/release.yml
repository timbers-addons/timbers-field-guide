# Managed by Warcraft Addon Manager. Edits may be overwritten.
name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package and create GitHub release
        uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore pre-release title
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            *-alpha*) TITLE="🛑 Alpha Build ($TAG)"; PRE=true ;;
            *-beta*)  TITLE="⚠️ Beta Test Build ($TAG)"; PRE=true ;;
            *)        TITLE="$TAG"; PRE=false ;;
          esac
          gh release edit "$TAG" --title "$TITLE" --prerelease=$PRE
      - name: Check for a CurseForge token
        id: curseforge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          if [ -n "$CF_API_KEY" ]; then echo "upload=true" >> "$GITHUB_OUTPUT"; fi
      - name: Read release clients
        id: clients
        if: steps.curseforge.outputs.upload == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          file=.publish/release-clients
          if [ ! -f "$file" ]; then
            echo "No $file: uploading for every client the TOCs declare."
            exit 0
          fi
          read -r for_tag versions < "$file" || true
          versions=${versions%$'\r'}
          if [ "$for_tag" != "$TAG" ]; then
            echo "$file is for another tag: uploading for every client the TOCs declare."
            exit 0
          fi
          if ! [[ "$versions" =~ ^[0-9]+\.[0-9]+\.[0-9]+(,[0-9]+\.[0-9]+\.[0-9]+)*$ ]]; then
            echo "::error::$file does not hold a game version list for $TAG"
            exit 1
          fi
          echo "Uploading for $versions only."
          # A single game type would add its name to the file name; keep the
          # name the same as an upload for every client.
          echo "args=-g $versions -n {package-name}-{project-version}{nolib}:{project-version}{nolib}" >> "$GITHUB_OUTPUT"
      - name: Upload to CurseForge
        if: steps.curseforge.outputs.upload == 'true'
        uses: BigWigsMods/packager@v2
        with:
          args: ${{ steps.clients.outputs.args }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
